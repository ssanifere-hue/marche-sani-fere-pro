<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Vendeur - APHRIKE JULA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F4F6F9;color:#1A2533;min-height:100vh}
.navbar{display:flex;align-items:center;gap:12px;padding:0 24px;height:56px;background:#1565C0;position:sticky;top:0;z-index:1000}
.navbar .brand{font-size:17px;font-weight:600;color:#fff;display:flex;align-items:center}
.navbar .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.navbar a,.navbar button{color:#fff;text-decoration:none;padding:8px 16px;border:1.5px solid rgba(255,255,255,.5);border-radius:100px;background:transparent;cursor:pointer;font-size:14px}
.logo-svg{height:1.15em;width:auto;vertical-align:-0.22em;margin-right:4px}
.container{max-width:900px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(13,60,130,.08);padding:28px;margin-bottom:24px}
h1,h2{color:#0D3C82}
h2{font-size:1.4rem;margin-bottom:18px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:.95rem}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #D8E1EC;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1565C0}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px}
.check input{width:auto}
.btn{background:#1565C0;color:#fff;border:none;padding:14px 24px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s;width:100%;margin-top:20px}
.btn:hover{background:#0D3C82}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-gold{background:#FFC107;color:#0D3C82}
.btn-gold:hover{background:#E0A800}
.alert{padding:14px 16px;border-radius:10px;margin-bottom:16px;font-weight:500;display:none}
.alert.show{display:block}
.alert-ok{background:#D4EDDA;color:#155724}
.alert-err{background:#F8D7DA;color:#721C24}
.hidden{display:none}
.login-wrap{max-width:420px;margin:60px auto}
.login-wrap .card{text-align:center}
.login-wrap input{text-align:center}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:16px}
.prod{border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;background:#fff}
.prod img{width:100%;height:130px;object-fit:cover;display:block}
.prod .p{padding:10px}
.prod .pn{font-weight:600;font-size:.9rem;margin-bottom:4px}
.prod .pp{color:#1565C0;font-weight:700}
.muted{color:#6B7C93;text-align:center;padding:30px}
.hint{font-size:.8rem;color:#6B7C93;margin-top:4px}
#previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#previews img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid #D8E1EC}
</style>
</head>
<body>

<nav class="navbar">
  <span class="brand">
    <svg viewBox="0 0 220 250" class="logo-svg" xmlns="http://www.w3.org/2000/svg" aria-label="APHRIKE JULA"><path d="M 54,40 C 70,30 110,28 150,32 C 158,33 164,38 168,46 C 175,56 182,66 196,82 C 200,87 200,92 194,94 C 184,96 176,100 170,108 C 166,120 164,135 158,152 C 152,170 146,184 138,198 C 130,212 122,222 114,223 C 108,223 104,216 101,206 C 97,192 95,176 92,160 C 90,150 88,142 84,136 C 81,131 76,130 70,131 C 60,132 52,130 46,124 C 40,118 38,118 30,114 C 24,111 24,104 30,100 C 40,94 44,86 46,74 C 47,62 48,50 54,40 Z" fill="#EAF1FB" stroke="#0D3C82" stroke-width="2" stroke-linejoin="round"/><ellipse cx="160" cy="185" rx="7" ry="17" transform="rotate(-22 160 185)" fill="#EAF1FB" stroke="#0D3C82" stroke-width="1.6"/></svg>
    APHRIKE JULA — Espace Vendeur
  </span>
  <div class="right">
    <a href="index.html">← Accueil</a>
    <button id="logoutBtn" class="hidden" onclick="logout()">Déconnexion</button>
  </div>
</nav>

<!-- ÉCRAN CONNEXION -->
<div id="loginScreen" class="login-wrap">
  <div class="card">
    <h2>Connexion vendeur</h2>
    <div id="loginAlert" class="alert"></div>
    <label>Téléphone (8 chiffres)</label>
    <input id="loginTel" type="tel" placeholder="70000000" maxlength="8">
    <label>Mot de passe</label>
    <input id="loginPwd" type="password" placeholder="••••••••">
    <button class="btn" id="loginBtn" onclick="login()">Se connecter</button>
    <p class="hint">Pas encore de boutique ? <a href="vendre.html">Inscrivez-vous ici</a></p>
  </div>
</div>

<!-- ÉCRAN VENDEUR -->
<div id="vendorScreen" class="container hidden">

  <div class="card">
    <h2>➕ Ajouter un produit</h2>
    <div id="addAlert" class="alert"></div>

    <label>Nom du produit *</label>
    <input id="f_nom" type="text" placeholder="Ex : Robe wax grand teint">

    <label>Description *</label>
    <textarea id="f_desc" placeholder="Décrivez votre produit..."></textarea>

    <div class="row">
      <div>
        <label>Prix (FCFA) *</label>
        <input id="f_prix" type="number" min="0" placeholder="15000">
      </div>
      <div>
        <label>Stock *</label>
        <input id="f_stock" type="number" min="0" value="1">
      </div>
    </div>

    <label>Catégorie *</label>
    <select id="f_cat">
      <option value="">— Choisir —</option>
      <option>Agriculture</option><option>Alimentation</option><option>Beauté</option>
      <option>Bâtiment</option><option>Enfants</option><option>Informatique</option>
      <option>Livres</option><option>Maison</option><option>Meubles</option>
      <option>Mode Femme</option><option>Mode Homme</option><option>Moto &amp; Pièces</option>
      <option>Plomberie</option><option>Quincaillerie</option><option>Santé</option>
      <option>Sport</option><option>Téléphonie</option><option>Véhicules</option>
    </select>

    <label>Photos du produit *</label>
    <input id="f_imgs" type="file" accept="image/*" multiple onchange="previewImgs()">
    <p class="hint">1 à 5 photos. La 1re sera la photo principale.</p>
    <div id="previews"></div>

    <div class="check">
      <input id="f_premium" type="checkbox">
      <label for="f_premium" style="margin:0">⭐ Mettre en avant (Premium)</label>
    </div>

    <button class="btn btn-gold" id="addBtn" onclick="addProduct()">Publier le produit</button>
  </div>

  <div class="card">
    <h2>📦 Mes produits</h2>
    <div id="mesProduits"><p class="muted">Chargement...</p></div>
  </div>

</div>

<script>
const API = 'https://web-production-8f94.up.railway.app';
let TOKEN = localStorage.getItem('aj_token') || null;
let VENDEUR_ID = localStorage.getItem('aj_vendeur_id') || null;

document.addEventListener('DOMContentLoaded', () => {
  if (TOKEN) showVendor(); else showLogin();
});

function showLogin(){ document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('vendorScreen').classList.add('hidden');
  document.getElementById('logoutBtn').classList.add('hidden'); }

function showVendor(){ document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('vendorScreen').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  loadMesProduits(); }

function alertBox(id,type,msg){ const a=document.getElementById(id);
  a.className='alert show '+(type==='ok'?'alert-ok':'alert-err'); a.textContent=msg;
  if(type==='ok') setTimeout(()=>a.classList.remove('show'),5000); }

function logout(){ localStorage.removeItem('aj_token'); localStorage.removeItem('aj_vendeur_id');
  TOKEN=null; VENDEUR_ID=null; showLogin(); }

async function login(){
  const tel=document.getElementById('loginTel').value.trim();
  const pwd=document.getElementById('loginPwd').value;
  if(!tel||!pwd){ alertBox('loginAlert','err','Renseignez téléphone et mot de passe.'); return; }
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='Connexion...';
  try{
    const r=await fetch(API+'/api/auth/login',{ method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({telephone:tel, mot_de_passe:pwd}) });
    const data=await r.json();
    if(!r.ok) throw new Error(data.detail || 'Identifiants incorrects');
    TOKEN = data.access_token || data.token || data.jwt;
    if(!TOKEN) throw new Error('Token manquant dans la réponse du serveur');
    localStorage.setItem('aj_token',TOKEN);
    // récupère l'id vendeur si dispo
    const u = data.user || data.vendeur || {};
    if(u.vendeur_id || u.id){ VENDEUR_ID = u.vendeur_id || u.id; localStorage.setItem('aj_vendeur_id',VENDEUR_ID); }
    showVendor();
  }catch(e){ alertBox('loginAlert','err','❌ '+e.message); }
  finally{ btn.disabled=false; btn.textContent='Se connecter'; }
}

function fileToDataURL(file){ return new Promise((res,rej)=>{
  const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); }); }

async function previewImgs(){
  const files=[...document.getElementById('f_imgs').files].slice(0,5);
  const box=document.getElementById('previews'); box.innerHTML='';
  for(const f of files){ const url=await fileToDataURL(f); const img=document.createElement('img'); img.src=url; box.appendChild(img); }
}

async function addProduct(){
  const nom=document.getElementById('f_nom').value.trim();
  const desc=document.getElementById('f_desc').value.trim();
  const prix=parseInt(document.getElementById('f_prix').value);
  const stock=parseInt(document.getElementById('f_stock').value);
  const cat=document.getElementById('f_cat').value;
  const premium=document.getElementById('f_premium').checked;
  const files=[...document.getElementById('f_imgs').files].slice(0,5);

  if(!nom||!desc||!cat||isNaN(prix)||isNaN(stock)){ alertBox('addAlert','err','Remplissez tous les champs obligatoires (*).'); return; }
  if(files.length===0){ alertBox('addAlert','err','Ajoutez au moins une photo.'); return; }

  const btn=document.getElementById('addBtn'); btn.disabled=true; btn.textContent='Publication en cours...';
  try{
    const images=[]; for(const f of files){ images.push(await fileToDataURL(f)); }
    const r=await fetch(API+'/api/produits',{ method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body:JSON.stringify({ nom, description:desc, prix, categorie:cat, stock,
        est_premium:premium, images, methodes_livraison:[], pays:'Mali' }) });
    const data=await r.json();
    if(r.status===401){ alertBox('addAlert','err','Session expirée, reconnectez-vous.'); logout(); return; }
    if(!r.ok) throw new Error(data.detail || 'Erreur lors de la publication');
    alertBox('addAlert','ok','✅ Produit publié avec succès !');
    document.getElementById('f_nom').value=''; document.getElementById('f_desc').value='';
    document.getElementById('f_prix').value=''; document.getElementById('f_stock').value='1';
    document.getElementById('f_cat').value=''; document.getElementById('f_premium').checked=false;
    document.getElementById('f_imgs').value=''; document.getElementById('previews').innerHTML='';
    loadMesProduits();
  }catch(e){ alertBox('addAlert','err','❌ '+e.message); }
  finally{ btn.disabled=false; btn.textContent='Publier le produit'; }
}

async function loadMesProduits(){
  const box=document.getElementById('mesProduits');
  if(!VENDEUR_ID){ box.innerHTML='<p class="muted">Vos produits s\'afficheront ici après publication.</p>'; return; }
  try{
    const r=await fetch(API+'/api/vendeurs/'+VENDEUR_ID+'/produits');
    const result=await r.json(); const produits=result.produits||result||[];
    if(!produits.length){ box.innerHTML='<p class="muted">Aucun produit pour l\'instant.</p>'; return; }
    box.innerHTML='<div class="prod-grid">'+produits.map(p=>{
      const img=(p.images||[]).filter(i=>i&&i.trim())[0]||'https://via.placeholder.com/300?text=Produit';
      const prix=new Intl.NumberFormat('fr-FR').format(p.prix);
      return `<div class="prod"><img src="${img}" onerror="this.src='https://via.placeholder.com/300?text=Image'">
        <div class="p"><div class="pn">${p.nom||'Produit'}</div><div class="pp">${prix} FCFA</div></div></div>`;
    }).join('')+'</div>';
  }catch(e){ box.innerHTML='<p class="muted">Vos produits s\'afficheront ici après publication.</p>'; }
}
</script>
</body>
</html>
