<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Produits - APHRIKE JULA Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .admin-header h1 {
            font-size: 1.8rem;
            color: var(--text-dark);
        }
        .action-bar {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-delete-bulk {
            padding: 0.6rem 1.5rem;
            background: #c62828;
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-delete-bulk:hover { opacity: 0.9; }
        .btn-delete-bulk:disabled { background: #e0e0e0; cursor: not-allowed; }
        
        .prod-table {
            width: 100%;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .prod-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .prod-table th {
            background: #f8f9fa;
            padding: 1rem;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-gray);
            text-transform: uppercase;
        }
        .prod-table td {
            padding: 1rem;
            border-top: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        .prod-table tr:hover td {
            background: #fafafa;
        }
        .prod-image {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #1565C0;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .status-msg {
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-weight: 600;
            display: none;
        }
        .status-msg.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .status-msg.error { display: block; background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <!-- Navbar APHRIKE JULA -->
    <nav class="aj-navbar" style="display:flex;align-items:center;gap:12px;padding:0 24px;height:56px;background:#1565C0;position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px rgba(21,101,192,0.3);">
        <a href="index.html" class="aj-brand" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;">
            <div class="aj-logo">
                <svg viewBox="0 0 220 250" width="34" height="34" style="vertical-align:middle" xmlns="http://www.w3.org/2000/svg" aria-label="APHRIKE JULA"><path d="M 54,40 C 70,30 110,28 150,32 C 158,33 164,38 168,46 C 175,56 182,66 196,82 C 200,87 200,92 194,94 C 184,96 176,100 170,108 C 166,120 164,135 158,152 C 152,170 146,184 138,198 C 130,212 122,222 114,223 C 108,223 104,216 101,206 C 97,192 95,176 92,160 C 90,150 88,142 84,136 C 81,131 76,130 70,131 C 60,132 52,130 46,124 C 40,118 38,118 30,114 C 24,111 24,104 30,100 C 40,94 44,86 46,74 C 47,62 48,50 54,40 Z" fill="#EAF1FB" stroke="#0D3C82" stroke-width="2" stroke-linejoin="round"/><ellipse cx="160" cy="185" rx="7" ry="17" transform="rotate(-22 160 185)" fill="#EAF1FB" stroke="#0D3C82" stroke-width="1.6"/><g transform="translate(62,84)"><polygon points="0,-19 5.7,-6 19,-6 8,2.5 12.5,15.5 0,7.5 -12.5,15.5 -8,2.5 -19,-6 -5.7,-6" fill="#F2A100" stroke="#A86604" stroke-width="1.3" stroke-linejoin="round"/><polygon points="0,-11.4 3.42,-3.6 11.4,-3.6 4.8,1.5 7.5,9.3 0,4.5 -7.5,9.3 -4.8,1.5 -11.4,-3.6 -3.42,-3.6" fill="#FFD400"/><polygon points="0,-19 5.7,-6 0,-3 -5.7,-6" fill="#FFF6C8" opacity="0.9"/><polygon points="17,-20 18.2,-16.2 22,-15 18.2,-13.8 17,-10 15.8,-13.8 12,-15 15.8,-16.2" fill="#FFFFFF" opacity="0.95"/><polygon points="-14,8 -13,11 -10,12 -13,13 -14,16 -15,13 -18,12 -15,11" fill="#FFFFFF" opacity="0.9"/><polygon points="16,7 16.7,9 19,9.7 16.7,10.4 16,12.5 15.3,10.4 13,9.7 15.3,9" fill="#FFF1B0" opacity="0.9"/></g></svg>
            </div>
            <span style="font-size:17px;font-weight:600;color:#fff;letter-spacing:-0.01em;white-space:nowrap;">APHRIKE JULA</span>
        </a>

        <div id="navActions" style="display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;">
            <a href="/dashboard" style="padding:8px 18px;border-radius:100px;font-size:14px;font-weight:600;border:none;cursor:pointer;background:#FFD700;color:#1565C0;text-decoration:none;transition:background 0.2s;">Dashboard</a>
            <a href="index.html" style="padding:7px 16px;border-radius:100px;font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.5);text-decoration:none;transition:background 0.2s;">← Retour à l'accueil</a>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <a href="/dashboard" class="back-link">← Retour au Dashboard</a>
                <h1 style="margin-top: 10px;">📦 Gestion des Produits (Admin)</h1>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div class="action-bar">
            <div>
                <span id="selectedCount">0</span> produit(s) sélectionné(s)
            </div>
            <button class="btn-delete-bulk" id="bulkDeleteBtn" disabled onclick="handleBulkDelete()">
                Supprimer la sélection
            </button>
        </div>

        <div class="prod-table">
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" id="selectAll" onclick="toggleSelectAll()">
                        </th>
                        <th style="width: 70px;">Image</th>
                        <th>Nom du produit</th>
                        <th>Vendeur (ID)</th>
                        <th>Prix</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="prodTableBody">
                    <tr><td colspan="6" style="text-align:center;padding:2rem;">Chargement des produits...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://web-production-8f94.up.railway.app';
        let allProducts = [];
        let selectedProductIds = new Set();

        // Vérification de sécurité au chargement
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            
            if (!token || !userStr) {
                window.location.href = 'connexion.html';
                return;
            }
            
            const user = JSON.parse(userStr);
            if (user.role !== 'admin') {
                document.querySelector('.admin-container').innerHTML = `
                    <div style="text-align:center; padding: 3rem;">
                        <h2>⛔ Accès Refusé</h2>
                        <p>Vous n'avez pas les droits d'administrateur.</p>
                        <a href="index.html" class="back-link">Retourner à l'accueil</a>
                    </div>
                `;
                return;
            }
            
            loadProducts();
        });

        function showStatus(msg, isError = false) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg ' + (isError ? 'error' : 'success');
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        async function loadProducts() {
            try {
                // Fetch up to 500 recent products for admin moderation
                const res = await fetch(`${API_BASE_URL}/api/produits?limit=500`);
                const data = await res.json();
                
                if (res.ok) {
                    allProducts = data.produits;
                    renderProducts();
                } else {
                    showStatus('Erreur de chargement des produits.', true);
                }
            } catch (error) {
                showStatus('Erreur réseau.', true);
            }
        }

        function renderProducts() {
            const tbody = document.getElementById('prodTableBody');
            if (!allProducts || allProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;">Aucun produit trouvé</td></tr>';
                return;
            }
            
            tbody.innerHTML = allProducts.map(p => {
                const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/50';
                const date = new Date(p.date_creation).toLocaleDateString('fr-FR');
                return `
                    <tr>
                        <td>
                            <input type="checkbox" class="prod-checkbox" value="${p.id}" onchange="toggleSelect('${p.id}', this.checked)">
                        </td>
                        <td><img src="${img}" class="prod-image"></td>
                        <td style="font-weight:600;">${p.nom}</td>
                        <td style="font-size:0.85rem;color:#666;">${p.vendeur_id || 'N/A'}</td>
                        <td style="font-weight:bold;color:#2e7d32;">${p.prix} FCFA</td>
                        <td style="font-size:0.85rem;">${date}</td>
                    </tr>
                `;
            }).join('');
            
            // Reset selection
            selectedProductIds.clear();
            document.getElementById('selectAll').checked = false;
            updateSelectionCount();
        }

        function toggleSelect(id, isChecked) {
            if (isChecked) {
                selectedProductIds.add(id);
            } else {
                selectedProductIds.delete(id);
                document.getElementById('selectAll').checked = false;
            }
            updateSelectionCount();
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAll').checked;
            const checkboxes = document.querySelectorAll('.prod-checkbox');
            
            checkboxes.forEach(cb => {
                cb.checked = isChecked;
                if (isChecked) {
                    selectedProductIds.add(cb.value);
                } else {
                    selectedProductIds.delete(cb.value);
                }
            });
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const count = selectedProductIds.size;
            document.getElementById('selectedCount').textContent = count;
            document.getElementById('bulkDeleteBtn').disabled = count === 0;
        }

        async function handleBulkDelete() {
            if (selectedProductIds.size === 0) return;
            
            if (!confirm(`Êtes-vous sûr de vouloir supprimer définitivement ces ${selectedProductIds.size} produit(s) ?`)) {
                return;
            }
            
            const btn = document.getElementById('bulkDeleteBtn');
            btn.disabled = true;
            btn.textContent = 'Suppression...';
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/api/admin/produits/bulk`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        product_ids: Array.from(selectedProductIds)
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showStatus(data.message);
                    await loadProducts(); // Recharger la liste
                } else {
                    const data = await response.json();
                    showStatus(data.detail || 'Erreur lors de la suppression', true);
                }
            } catch (error) {
                showStatus('Erreur de réseau.', true);
            } finally {
                btn.disabled = selectedProductIds.size === 0;
                btn.textContent = 'Supprimer la sélection';
            }
        }
    </script>
</body>
</html>
