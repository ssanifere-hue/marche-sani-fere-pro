<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - APHRIKE JULA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="aj-navbar" style="display:flex;align-items:center;gap:12px;padding:0 24px;height:56px;background:#1565C0;position:sticky;top:0;z-index:1000;">
        <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
            <span style="font-size:17px;font-weight:600;color:#fff;">⭐ APHRIKE JULA</span>
        </a>
        <div style="margin-left:auto;display:flex;gap:10px;">
            <a href="index.html" style="color:#fff;text-decoration:none;padding:8px 16px;border:1.5px solid rgba(255,255,255,0.5);border-radius:100px;">← Retour</a>
        </div>
    </nav>

    <div class="container" style="margin-top:2rem;">
       <div id="boutiqueHeader" style="position:relative;border-radius:12px;overflow:hidden;margin-bottom:2rem;min-height:200px;">
    <div id="banniereDiv" style="width:100%;height:200px;background:#1565C0;background-size:cover;background-position:center;"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.7));padding:1.5rem;display:flex;align-items:flex-end;gap:1rem;">
        <img id="vendeurLogo" src="" style="width:80px;height:80px;border-radius:50%;border:3px solid #FFD700;object-fit:cover;display:none;">
        <div id="vendeurAvatar" style="width:80px;height:80px;border-radius:50%;background:#FFD700;color:#1565C0;font-size:2rem;font-weight:700;display:flex;align-items:center;justify-content:center;"></div>
        <div style="color:white;">
            <h1 id="vendeurNom" style="margin:0;font-size:1.8rem;">Chargement...</h1>
            <p id="vendeurInfo" style="margin:0;opacity:0.85;"></p>
        </div>
    </div>
</div>
        <h2 style="margin-bottom:1rem;">Produits de la boutique</h2>
        <div id="produitsGrid" class="products-grid">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://web-production-8f94.up.railway.app';

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const vendeurId = params.get('id');
            if (!vendeurId) { window.location.href = 'index.html'; return; }
            loadBoutique(vendeurId);
        });

        async function loadBoutique(vendeurId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/vendeurs/${vendeurId}`);
                const vendeur = await response.json();
                document.getElementById('vendeurAvatar').textContent = (vendeur.nom_boutique || vendeur.nom || 'B').charAt(0).toUpperCase();
                document.getElementById('vendeurNom').textContent = vendeur.nom_boutique || vendeur.nom || 'Boutique';
                document.getElementById('vendeurInfo').textContent = vendeur.description || '';
                document.title = (vendeur.nom_boutique || 'Boutique') + ' - APHRIKE JULA';
                if (vendeur.banniere) { document.getElementById('banniereDiv').style.backgroundImage = `url('${vendeur.banniere}')`; }
if (vendeur.logo) { document.getElementById('vendeurLogo').src = vendeur.logo; document.getElementById('vendeurLogo').style.display = 'block'; document.getElementById('vendeurAvatar').style.display = 'none'; }
            } catch(e) {
                document.getElementById('vendeurNom').textContent = 'Boutique';
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/vendeurs/${vendeurId}/produits`);
                const result = await response.json(); const produits = result.produits || result;
                const grid = document.getElementById('produitsGrid');
                if (!produits || produits.length === 0) {
                    grid.innerHTML = '<p style="text-align:center;padding:3rem;">Aucun produit dans cette boutique.</p>';
                    return;
                }
                grid.innerHTML = produits.map(p => {
                    const nom = p.nom || p.titre || 'Produit';
                    const imgs = (p.images || []).filter(i => i && i.trim());
                    const img = imgs.length ? imgs[0] : 'https://via.placeholder.com/400x400/F4F6F9/B5C4DA?text=Produit';
                    const prix = new Intl.NumberFormat('fr-FR').format(p.prix);
                    const premium = p.est_premium ? '<div class="product-badge">\u2605 PREMIUM</div>' : '';
                    return `
                    <a href="produit.html?id=${p.id}" class="product-card">
                        ${premium}
                        <span class="product-fav">\u2661</span>
                        <img src="${img}" class="product-image" alt="${nom}"
                             onerror="this.src='https://via.placeholder.com/400x400/F4F6F9/B5C4DA?text=Image'">
                        <div class="product-info">
                            <div class="product-title">${nom}</div>
                            <div><span class="product-price">${prix} <span class="devise">FCFA</span></span></div>
                        </div>
                    </a>
                `;
                }).join('');
            } catch(e) {
                document.getElementById('produitsGrid').innerHTML = '<p style="text-align:center;padding:3rem;">Erreur de chargement des produits.</p>';
            }
        }
    </script>
</body>
</html>
